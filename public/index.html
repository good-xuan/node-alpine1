<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影视平台登录</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background:
        linear-gradient(rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0.8)),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1920&q=85")
        center / cover no-repeat;
      color: #fff;
    }

    .login-container {
      width: 400px;
      padding: 42px 38px 36px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(15, 15, 18, 0.86);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
    }

    .logo {
      margin-bottom: 8px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #e50914;
    }

    .subtitle {
      margin-bottom: 30px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #444;
      border-radius: 6px;
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 15px;
      transition: 0.25s;
    }

    .form-group input::placeholder {
      color: #888;
    }

    .form-group input:focus {
      border-color: #e50914;
      box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.15);
    }

    .login-button {
      width: 100%;
      height: 46px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #e50914;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      transition: 0.25s;
    }

    .login-button:hover {
      background: #f6121d;
      transform: translateY(-1px);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .error-message {
      min-height: 22px;
      margin-top: 16px;
      text-align: center;
      color: #ff5964;
      font-size: 14px;
    }

    .footer-text {
      margin-top: 25px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-container {
        width: calc(100% - 32px);
        padding: 36px 25px 30px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">MOVIE</div>
    <div class="subtitle">登录影视平台，开启精彩观影</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input
          type="text"
          id="username"
          placeholder="请输入用户名"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input
          type="password"
          id="password"
          placeholder="请输入密码"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="login-button">登 录</button>

      <div id="errorMessage" class="error-message"></div>
    </form>

    <div class="footer-text">© 2026 MOVIE · 精彩影视内容</div>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const errorMessage = document.getElementById("errorMessage");

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      // 无论输入什么内容，都显示登录失败
      errorMessage.textContent = "用户名或密码错误";
    });
  </script>

</body>
</html>
